<div class="match-card" [routerLink]="routerLink">
  <div class="card-header">
    <div class="badges">
      <span class="type-badge">{{ match.matchType }}</span>
      <span class="status-badge"
            [ngClass]="{'live-s': match.status === 'Live', 'completed-s': match.status === 'Completed', 'upcoming-s': match.status === 'Upcoming'}">
        <span *ngIf="match.status === 'Live'" class="dot-live"></span>
        {{ match.status }}
      </span>
    </div>
    <span class="match-date">{{ match.date }}</span>
  </div>

  <div class="teams-section">
    <div class="team-row" [ngClass]="{'batting-now': match.innings[match.currentInningsIndex]?.battingTeam === match.homeTeam && match.status === 'Live'}">
      <span class="flag">{{ match.homeTeamFlag }}</span>
      <span class="team-label">{{ match.homeTeam }}</span>
      <span class="team-score-text">{{ homeScore }}</span>
    </div>
    <div class="vs-divider">vs</div>
    <div class="team-row" [ngClass]="{'batting-now': match.innings[match.currentInningsIndex]?.battingTeam === match.awayTeam && match.status === 'Live'}">
      <span class="flag">{{ match.awayTeamFlag }}</span>
      <span class="team-label">{{ match.awayTeam }}</span>
      <span class="team-score-text">{{ awayScore }}</span>
    </div>
  </div>

  <div class="card-footer">
    <span class="summary-text" [ngClass]="{'result-text': match.result}">{{ matchSummary }}</span>
    <span class="view-btn">View Scorecard →</span>
  </div>

  <div class="venue-text">📍 {{ match.venue }}</div>
</div>
